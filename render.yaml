databases:
  - name: secure-share-db
    plan: free
    region: frankfurt
    databaseName: secure_share
    user: secure_share_user

services:
  - type: web
    name: secure-share-api
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/tzbeksultan/secure-share
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: secure-share-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://tzbeksultan.github.io
